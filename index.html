     只設上限、沒設下限，手機螢幕寬度本來就遠小於 1000px，畫面不受影響 */
  .frame{

    max-width:1000px;

  .hero{

  /* 底圖與文字可讀性遮罩：position:fixed 貼齊視窗，高度用 100vh／100lvh。
     iOS Safari 的 vh 一律等於「網址列收起時」的最大視窗高度，所以固定
     定位元素用它必定夠高，網址列展開時只是被工具列蓋住一小截，收起時

  // iOS Safari 若無 touch 監聽會延遲甚至跳過 :active，導致點擊回饋變慢
  document.addEventListener('touchstart', function(){}, {passive:true});

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
