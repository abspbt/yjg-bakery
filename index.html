  :root{
    --font-brand:"Brand LXGW WenKai TC Light","Songti TC","Noto Serif TC","STSong","PMingLiU",serif;
    --ink:#fff;
    --ink-dim:rgba(255,255,255,.78);
    --ink-soft:rgba(255,255,255,.88);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    /* 與 theme-color 同色：橡皮筋回彈或瀏覽器取樣邊緣色時都不會露出冷色底 */
    background:#2A1F20;
    /* 關閉橡皮筋回彈，避免下拉時把底圖之外的底色扯進畫面 */
    overscroll-behavior:none;
    /* 強制常駐垂直捲軸軌道，跟子頁一致，避免換頁時因為「這頁有沒有捲軸」
       不同、導致可視寬度忽窄忽寬，讓左右置中的版面跟著跳動 */
    overflow-y:scroll;
  }
  /* 捲軸配色跟著品牌深咖啡底／金色重點走，避免瀏覽器預設的亮色（通常
     是白色）軌道在暗色背景右緣顯得突兀 */
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:#2A1F20;}
  ::-webkit-scrollbar-thumb{background:rgba(244,227,193,.35);border-radius:999px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(244,227,193,.55);}
  html{scrollbar-color:rgba(244,227,193,.35) #2A1F20;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  /* 桌面寬螢幕限制版面最大寬度為 1000px（與子頁 header/main 的寬度上限一致），
     避免底圖被 cover 裁切放大成誇張的全螢幕特寫；超出寬度的兩側露出品牌底色。
     只設上限、沒設下限，手機螢幕寬度本來就遠小於 1000px，畫面不受影響 */
  .frame{
    position:relative;
    max-width:1000px;
    margin:0 auto;
    min-height:100dvh;
    overflow:hidden;
  }

  .hero{
    position:relative;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  /* 底圖與文字可讀性遮罩：position:fixed 貼齊視窗，高度用 100vh／100lvh。
     iOS Safari 的 vh 一律等於「網址列收起時」的最大視窗高度，所以固定
     定位元素用它必定夠高，網址列展開時只是被工具列蓋住一小截，收起時
     剛好填滿——不會有任何狀態露出底色。
     刻意不使用 dvh（會隨網址列縮小）也不使用 JS 量測的高度（雙指縮放時
     innerHeight 會回報縮放後的視覺高度，導致底圖被算小而露出底色）。 */
  .hero-bg,
  .hero-scrim{
    position:absolute;
    top:0;left:0;right:0;
    height:100vh;
    height:100lvh;
    pointer-events:none;
  }
  .hero-bg{
    z-index:0;
    background:url("assets/img/home-bg.jpg") center 28% / cover no-repeat;
    view-transition-name:bg-photo;
  }
  .hero-scrim{
    z-index:1;
    background:linear-gradient(180deg, rgba(10,8,20,.70) 0%, rgba(10,8,20,.08) 24%, rgba(10,8,20,.12) 58%, rgba(10,8,20,.76) 100%);
    view-transition-name:bg-overlay;
  }

  header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(16px + var(--safe-t)) 20px 16px;
  }
  .brand{
    font-family:var(--font-brand);
    font-size:15px;
    font-weight:300;
    letter-spacing:.02em;
  }
  .hero-copy{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:left;
    padding:24px calc(96px + 16px) calc(28px + var(--safe-b)) 28px;
    gap:10px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:#f4e3c1;
    animation:rise .7s ease-out both;
  }
  .title{
    display:block;
    line-height:0;
    animation:rise .7s .06s ease-out both;
  }
  .title img{
    display:block;
    height:clamp(24px,7.15vw,33px);
    width:auto;
  }
  .desc{
    font-size:14px;
    line-height:1.7;
    color:rgba(244,227,193,.82);
    animation:rise .7s .12s ease-out both;
  }
  @keyframes rise{
    from{opacity:.01;transform:translateY(14px);}
    to{opacity:1;transform:none;}
  }

  .side-nav{
    position:absolute;
    top:50%;
    right:26px;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    transform:translateY(-50%);
  }
  .navtab{
    display:flex;
    align-items:baseline;
    justify-content:flex-end;
    gap:10px;
    padding:12px 0;
    -webkit-appearance:none;
    appearance:none;
    background:none;
    background-color:transparent;
    border:none;
    border-top:1px solid rgba(255,255,255,.24);
    border-radius:0;
    color:var(--ink-soft);
    text-decoration:none;
    font:inherit;
    font-size:14px;
    letter-spacing:.16em;
    text-align:right;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    /* 純筆畫暈影：三層同心、由內而外遞減，只跟著每個字的筆畫走，
       不使用任何整片底板。顏色用畫面同調的暖深色而非純黑——純黑壓在
       暖色照片上會把周圍一起蒙灰。刻意不用 -webkit-text-stroke——14px
       的繁中筆畫密度高，描邊會把「嘴／雞／蛋」的字腔填實反而更難讀。 */
    text-shadow:
      0 0 1px rgba(26,17,12,.62),
      0 0 3px rgba(26,17,12,.45),
      0 1px 4px rgba(26,17,12,.34);

  /* 換頁平滑轉場：View Transitions API（配合 <meta name="view-transition">）。

  @media (prefers-reduced-motion: no-preference){

  @keyframes vt-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes vt-out{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(-10px);}}
