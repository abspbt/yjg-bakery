name = "yjg-bakery-home"
compatibility_date = "2024-11-01"

# 官網首頁是純靜態多頁網站（沒有伺服器端程式碼），
# 這支設定檔只給 Cloudflare Dashboard「連結到 Git」的部署流程用。
[assets]
directory = "."
# 曾經在這裡設過 html_handling = "none" 想解決 sw.js 的 Safari 重導向錯誤
# （見 sw.js 內註解），結果這個設定同時關掉了 Cloudflare「資料夾自動對應
# index.html」的行為，導致網站根目錄 "/" 本身變成打不開（一片空白）。
# PWA manifest 的 start_url 是 "/"，所有頁面 canonical 也都指回 "/"，這個
# 副作用比原本要修的問題嚴重得多，所以改回預設值（不設定 html_handling，
# 即 Cloudflare 預設的 "auto-trailing-slash"）。sw.js 那邊已經改成用
# new Response() 重新包裝過重導向的回應，即使 Cloudflare 仍會把
# /about.html 301 導向 /about，也不會再讓 Safari 丟出那個錯誤了。
